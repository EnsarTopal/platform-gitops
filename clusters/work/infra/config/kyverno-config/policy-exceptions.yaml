# ── MetalLB Speaker ─────────────────────────────────────────
# Host network + host PID gerektiriyor, root olarak çalışıyor
apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: metallb-speaker-exception
  namespace: metallb-system
spec:
  exceptions:
  - policyName: disallow-host-namespaces
    ruleNames: ["host-namespaces", "autogen-host-namespaces"]
  - policyName: disallow-root-user
    ruleNames: ["check-root-user", "autogen-check-root-user"]
  - policyName: require-resource-limits
    ruleNames: ["check-resource-limits", "autogen-check-resource-limits"]
  match:
    any:
    - resources:
        kinds: ["Pod", "DaemonSet"]
        namespaces: ["metallb-system"]
        names: ["metallb-speaker*"]
---
# ── Prometheus Node Exporter ─────────────────────────────────
# Host network + hostPID gerektiriyor (node metrics toplamak için)
apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: node-exporter-exception
  namespace: monitoring
spec:
  exceptions:
  - policyName: disallow-host-namespaces
    ruleNames: ["host-namespaces", "autogen-host-namespaces"]
  - policyName: require-resource-limits
    ruleNames: ["check-resource-limits", "autogen-check-resource-limits"]
  match:
    any:
    - resources:
        kinds: ["Pod", "DaemonSet"]
        namespaces: ["monitoring"]
        names: ["monitoring-prometheus-node-exporter*"]
---
# ── Kyverno Kendi Pod'ları ───────────────────────────────────
# Kyverno bileşenleri resource limits olmadan deploy ediliyor
apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: kyverno-exception
  namespace: kyverno
spec:
  exceptions:
  - policyName: require-resource-limits
    ruleNames: ["check-resource-limits", "autogen-check-resource-limits"]
  match:
    any:
    - resources:
        kinds: ["Pod", "Deployment"]
        namespaces: ["kyverno"]
---
# ── Harbor ──────────────────────────────────────────────────
# Harbor bazı bileşenler root + privilege escalation gerektiriyor
apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: harbor-exception
  namespace: harbor
spec:
  exceptions:
  - policyName: disallow-privilege-escalation
    ruleNames: ["check-privilege-escalation", "autogen-check-privilege-escalation"]
  - policyName: disallow-root-user
    ruleNames: ["check-root-user", "autogen-check-root-user"]
  - policyName: require-resource-limits
    ruleNames: ["check-resource-limits", "autogen-check-resource-limits"]
  match:
    any:
    - resources:
        kinds: ["Pod", "Deployment", "StatefulSet"]
        namespaces: ["harbor"]
---
# ── Tekton Triggers ─────────────────────────────────────────
apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: tekton-triggers-exception
  namespace: tekton-pipelines
spec:
  exceptions:
  - policyName: require-resource-limits
    ruleNames: ["check-resource-limits", "autogen-check-resource-limits"]
  match:
    any:
    - resources:
        kinds: ["Pod", "Deployment"]
        namespaces: ["tekton-pipelines", "tekton-pipelines-resolvers"]
        names: ["tekton-triggers*", "tekton-pipelines-remote-resolvers*"]
