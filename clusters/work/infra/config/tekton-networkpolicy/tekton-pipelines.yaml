apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekton-pipelines-default-deny-ingress
  namespace: tekton-pipelines
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekton-pipelines-allow-same-namespace
  namespace: tekton-pipelines
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekton-pipelines-allow-dns-egress
  namespace: tekton-pipelines
spec:
  podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekton-pipelines-allow-kube-api-egress
  namespace: tekton-pipelines
spec:
  podSelector: {}
  egress:
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
        - ipBlock:
            cidr: 10.25.25.13/32
        - ipBlock:
            cidr: 10.25.25.14/32
        - ipBlock:
            cidr: 10.25.25.18/32
        - ipBlock:
            cidr: 192.168.71.64/32
        - ipBlock:
            cidr: 192.168.64.128/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekton-pipelines-allow-kube-apiserver-ingress
  namespace: tekton-pipelines
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.25.25.13/32
        - ipBlock:
            cidr: 10.25.25.14/32
        - ipBlock:
            cidr: 10.25.25.18/32
        - ipBlock:
            cidr: 192.168.71.64/32
        - ipBlock:
            cidr: 192.168.64.128/32
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 443
