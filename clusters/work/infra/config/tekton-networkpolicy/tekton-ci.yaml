apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekton-ci-default-deny-ingress
  namespace: tekton-ci
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekton-ci-allow-same-namespace
  namespace: tekton-ci
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekton-ci-allow-dns-egress
  namespace: tekton-ci
spec:
  podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekton-ci-allow-kube-api-egress
  namespace: tekton-ci
spec:
  podSelector: {}
  egress:
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
        - ipBlock:
            cidr: 10.25.25.13/32
        - ipBlock:
            cidr: 10.25.25.14/32
        - ipBlock:
            cidr: 10.25.25.18/32
        - ipBlock:
            cidr: 192.168.71.64/32
        - ipBlock:
            cidr: 192.168.64.128/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
  policyTypes:
    - Egress
---
# Tekton pipeline pod'ları harbor'a push/pull yapabilmeli
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekton-ci-allow-harbor-egress
  namespace: tekton-ci
spec:
  podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5000
  policyTypes:
    - Egress
---
# Tekton pipeline pod'ları gitea'ya erişmeli
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekton-ci-allow-gitea-egress
  namespace: tekton-ci
spec:
  podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitea
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 22
  policyTypes:
    - Egress
---
# EventListener ingress'ten webhook alabilmeli
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekton-ci-allow-from-ingress-nginx
  namespace: tekton-ci
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  policyTypes:
    - Ingress
---
# git clone https://gitea.lab.local → ingress-nginx:443 üzerinden geçer
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekton-ci-allow-ingress-nginx-egress
  namespace: tekton-ci
spec:
  podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
  policyTypes:
    - Egress
