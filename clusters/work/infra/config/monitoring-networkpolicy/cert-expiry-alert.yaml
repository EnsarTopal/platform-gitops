apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-expiry
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: cert-manager
      rules:
        - alert: CertificateExpiringSoon
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 21
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TLS sertifikası 21 gün içinde sona eriyor"
            description: "{{ $labels.namespace }}/{{ $labels.name }} sertifikası {{ $value | printf \"%.0f\" }} gün sonra sona eriyor."
        - alert: CertificateExpired
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "TLS sertifikası süresi DOLDU"
            description: "{{ $labels.namespace }}/{{ $labels.name }} sertifikası sona erdi!"
        - alert: CertificateNotReady
          expr: |
            certmanager_certificate_ready_status{condition="False"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "TLS sertifikası hazır değil"
            description: "{{ $labels.namespace }}/{{ $labels.name }} Ready=False."
