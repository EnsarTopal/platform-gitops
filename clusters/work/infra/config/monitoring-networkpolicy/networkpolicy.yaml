---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-grafana-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
    - to:
        - podSelector:
            matchLabels:
              prometheus: monitoring-kube-prometheus-prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              alertmanager: monitoring-kube-prometheus-alertmanager
      ports:
        - protocol: TCP
          port: 9093
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 80
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-grafana-https-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
    - ports:
        - protocol: TCP
          port: 443
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-promtail-to-loki
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: promtail
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 80
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-kube-api-egress
  namespace: monitoring
spec:
  podSelector: {}
  egress:
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
        - ipBlock:
            cidr: 10.25.25.13/32
        - ipBlock:
            cidr: 10.25.25.14/32
        - ipBlock:
            cidr: 10.25.25.18/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
  policyTypes:
    - Egress
---
# Prometheus → tüm node'lar: kubelet, kube-proxy, node-exporter, CP metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-prometheus-node-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      prometheus: monitoring-kube-prometheus-prometheus
  egress:
    - to:
        - ipBlock:
            cidr: 10.25.25.14/32
        - ipBlock:
            cidr: 10.25.25.15/32
        - ipBlock:
            cidr: 10.25.25.16/32
        - ipBlock:
            cidr: 10.25.25.17/32
        - ipBlock:
            cidr: 10.25.25.18/32
      ports:
        - protocol: TCP
          port: 9100   # node-exporter
        - protocol: TCP
          port: 10249  # kube-proxy
        - protocol: TCP
          port: 10250  # kubelet
        - protocol: TCP
          port: 10257  # kube-controller-manager
        - protocol: TCP
          port: 10259  # kube-scheduler
        - protocol: TCP
          port: 2381   # etcd metrics
  policyTypes:
    - Egress
---
# Prometheus → pod CIDR: coredns, metrics-server, diğer pod scrape'leri
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-prometheus-pod-scrape-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      prometheus: monitoring-kube-prometheus-prometheus
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 9153   # coredns
        - protocol: TCP
          port: 10250  # kubelet via pod IP
        - protocol: TCP
          port: 10255  # kubelet read-only
        - protocol: TCP
          port: 8080   # metrics-server
        - protocol: TCP
          port: 9090   # prometheus federation
        - protocol: TCP
          port: 9091   # pushgateway
  policyTypes:
    - Egress
