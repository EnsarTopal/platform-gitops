# gitea-credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitea-credentials
  namespace: tekton-ci
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: gitea-credentials
    template:
      type: kubernetes.io/basic-auth
  data:
  - secretKey: username
    remoteRef:
      key: tekton-secrets
      property: gitea-username
  - secretKey: password
    remoteRef:
      key: tekton-secrets
      property: gitea-password
---
