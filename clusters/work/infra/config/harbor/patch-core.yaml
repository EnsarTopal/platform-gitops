apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-harbor-core
  namespace: harbor
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: core
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
