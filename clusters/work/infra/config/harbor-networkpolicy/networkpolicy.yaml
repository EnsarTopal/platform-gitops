apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: harbor-default-deny-ingress
  namespace: harbor
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: harbor-allow-same-namespace
  namespace: harbor
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: harbor-allow-dns-egress
  namespace: harbor
spec:
  podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: harbor-allow-from-ingress-nginx
  namespace: harbor
spec:
  podSelector:
    matchExpressions:
      - key: component
        operator: In
        values:
          - core
          - portal
          - registry
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 8080
  policyTypes:
    - Ingress
---
# proxy cache için dockerhub, ghcr, quay internet egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: harbor-allow-internet-egress
  namespace: harbor
spec:
  podSelector:
    matchLabels:
      component: core
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
  policyTypes:
    - Egress
