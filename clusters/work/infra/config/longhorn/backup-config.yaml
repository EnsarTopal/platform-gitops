# Backup target — MinIO S3
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: backup-target
  namespace: longhorn-system
value: "s3://longhorn-backup@us-east-1/backups"
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: backup-target-credential-secret
  namespace: longhorn-system
value: "minio-backup-secret"
---
# Günlük snapshot — tüm volume'ler
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot
  namespace: longhorn-system
spec:
  cron: "0 2 * * *"       # her gece 02:00
  task: snapshot
  groups:
  - default
  retain: 7               # 7 günlük snapshot tut
  concurrency: 2
  labels:
    type: daily
---
# Günlük backup — MinIO'ya
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "0 3 * * *"       # her gece 03:00
  task: backup
  groups:
  - default
  retain: 14              # 14 günlük backup tut
  concurrency: 2
  labels:
    type: daily
---
# Haftalık backup — uzun süreli
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-backup
  namespace: longhorn-system
spec:
  cron: "0 4 * * 0"       # her Pazar 04:00
  task: backup
  groups:
  - default
  retain: 4               # 4 haftalık backup tut
  concurrency: 1
  labels:
    type: weekly
