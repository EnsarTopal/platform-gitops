apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: infra-longhorn-config:batch/CronJob:kube-system/etcd-backup
  name: etcd-backup
  namespace: kube-system
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      creationTimestamp: null
    spec:
      backoffLimit: 1
      template:
        metadata:
          creationTimestamp: null
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - |
              set -e
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              DEST_FILE="etcd-backups/etcd-snapshot-${TIMESTAMP}.db"

              echo "Configuring mc..."
              mc alias set local "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" --api S3v4

              echo "Uploading to MinIO: ${DEST_FILE}"
              mc cp /var/lib/etcd-backup/etcd-snapshot.db "local/${MINIO_BUCKET}/${DEST_FILE}"
              echo "Upload completed: ${DEST_FILE}"

              echo "Keeping last 7 backups, removing older ones..."
              mc ls "local/${MINIO_BUCKET}/etcd-backups/" | sort | head -n -7 | while read -r line; do
                fname=$(echo "$line" | rev | cut -d" " -f1 | rev)
                [ -n "$fname" ] && mc rm "local/${MINIO_BUCKET}/etcd-backups/${fname}" && echo "Removed: $fname"
              done || true

              echo "Current backups:"
              mc ls "local/${MINIO_BUCKET}/etcd-backups/"
            envFrom:
            - secretRef:
                name: etcd-backup-minio
            image: harbor.lab.local/proxy-dockerhub/minio/mc:RELEASE.2024-01-13T08-44-48Z
            imagePullPolicy: IfNotPresent
            name: minio-upload
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 50m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: false
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
            - mountPath: /var/lib/etcd-backup
              name: backup-dir
          dnsPolicy: ClusterFirstWithHostNet
          hostNetwork: true
          initContainers:
          - command:
            - /bin/sh
            - -c
            - |
              set -e
              SNAPSHOT_FILE="/var/lib/etcd-backup/etcd-snapshot.db"
              ETCDCTL_API=3 etcdctl \
                --endpoints=https://127.0.0.1:2379 \
                --cacert=/etc/kubernetes/pki/etcd/ca.crt \
                --cert=/etc/kubernetes/pki/apiserver-etcd-client.crt \
                --key=/etc/kubernetes/pki/apiserver-etcd-client.key \
                snapshot save "${SNAPSHOT_FILE}"
              ETCDCTL_API=3 etcdctl \
                --write-out=table \
                snapshot status "${SNAPSHOT_FILE}"
              echo "Snapshot saved: ${SNAPSHOT_FILE}"
            image: registry.k8s.io/etcd:3.5.17-0
            imagePullPolicy: IfNotPresent
            name: etcd-snapshot
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: false
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
            - mountPath: /etc/kubernetes/pki
              name: kubernetes-pki
              readOnly: true
            - mountPath: /var/lib/etcd-backup
              name: backup-dir
          nodeName: k8s-cp1
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          restartPolicy: OnFailure
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: etcd-backup
          serviceAccountName: etcd-backup
          terminationGracePeriodSeconds: 30
          volumes:
          - hostPath:
              path: /etc/kubernetes/pki
              type: Directory
            name: kubernetes-pki
          - hostPath:
              path: /var/lib/etcd-backup
              type: DirectoryOrCreate
            name: backup-dir
  schedule: 0 1 * * *
  successfulJobsHistoryLimit: 3
  suspend: false
status:
  lastScheduleTime: "2026-03-12T01:00:00Z"
  lastSuccessfulTime: "2026-03-10T19:37:53Z"
