# kube-system sistem pod'ları — host network zorunlu
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: kube-system-exception
  namespace: kyverno
spec:
  exceptions:
  - policyName: disallow-host-namespaces
    ruleNames:
    - host-namespaces
    - autogen-host-namespaces
  - policyName: disallow-privilege-escalation
    ruleNames:
    - check-privilege-escalation
    - autogen-check-privilege-escalation
  - policyName: disallow-privileged-containers
    ruleNames:
    - check-privileged-containers
    - autogen-check-privileged-containers
  - policyName: disallow-root-user
    ruleNames:
    - check-root-user
    - autogen-check-root-user
  - policyName: require-resource-limits
    ruleNames:
    - check-resource-limits
    - autogen-check-resource-limits
  - policyName: require-image-registry
    ruleNames:
    - check-image-registry
    - autogen-check-image-registry
  - policyName: require-probes
    ruleNames:
    - check-probes
    - autogen-check-probes
  match:
    any:
    - resources:
        namespaces:
        - kube-system
        kinds:
        - Pod
        - DaemonSet
        - Deployment
        - ReplicaSet
        - StatefulSet
---
