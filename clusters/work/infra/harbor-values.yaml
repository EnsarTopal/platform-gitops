expose:
  type: ingress
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: harbor-tls
  ingress:
    hosts:
      core: harbor.lab.local
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: lab-ca-issuer
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"   # 0 = limitsiz (image push için şart)
      nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "900"

externalURL: https://harbor.lab.local

# İlk kurulumda değiştir, sonra secret'a taşı
harborAdminPassword: "Harbor12345!"

# Log seviyesi — prod'da warning/error yeter
logLevel: warning

persistence:
  enabled: true
  resourcePolicy: "keep"   # helm uninstall yapsan bile PVC silinmesin
  persistentVolumeClaim:
    registry:
      size: 20Gi
    chartmuseum:
      size: 5Gi
    jobservice:
      jobLog:
        size: 2Gi
    database:
      size: 5Gi
    redis:
      size: 2Gi
    trivy:
      size: 5Gi

# Güvenlik taraması — trivy aktif
trivy:
  enabled: true
  autoUpdate: true

# Update stratejisi — registry pod'u RollingUpdate ile güncelle
updateStrategy:
  type: RollingUpdate

metrics:
  enabled: true
  serviceMonitor:
    enabled: true   # Prometheus stack varsa ServiceMonitor otomatik oluşsun
