apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-netbox
  namespace: argocd
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: netbox
  source:
    chart: netbox
    repoURL: https://netbox-community.github.io/netbox-chart/
    targetRevision: 8.0.11
    helm:
      releaseName: netbox
      values: |
        global:
          storageClass: longhorn
          security:
            allowInsecureImages: true

        image:
          registry: harbor.lab.local
          repository: proxy-dockerhub/netboxcommunity/netbox
          tag: v4.5.4

        init:
          image:
            registry: harbor.lab.local
            repository: proxy-dockerhub/library/busybox
            tag: 1.37.0

        superuser:
          name: admin
          email: admin@example.local
          password: "Netbox123!"
          apiToken: "NetboxToken123456789"

        allowedHosts:
          - "netbox.lab.local"

        replicaCount: 1

        nodeSelector:
          kubernetes.io/hostname: k8s-w1

        service:
          type: ClusterIP

        ingress:
          enabled: true
          className: nginx
          pathType: Prefix
          hosts:
            - host: netbox.lab.local
              paths:
                - /
          tls: []

        persistence:
          enabled: true
          size: 5Gi

        resources:
          requests:
            cpu: 500m
            memory: 1024Mi
          limits:
            cpu: 750m
            memory: 1536Mi

        postgresql:
          enabled: true
          image:
            registry: harbor.lab.local
            repository: library/postgresql
            tag: 17.6.0-debian-12-r4
          auth:
            username: netbox
            password: "netboxdbpass"
            database: netbox

        valkey:
          enabled: true
          image:
            registry: harbor.lab.local
            repository: bitnamilegacy/valkey
            tag: 8.1.3-debian-12-r3

        worker:
          nodeSelector:
            kubernetes.io/hostname: k8s-w1
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          waitForBackend:
            image:
              registry: harbor.lab.local
              repository: proxy-dockerhub/rancher/kubectl
              tag: v1.35.2

        housekeeping:
          enabled: false

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
