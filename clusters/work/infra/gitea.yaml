apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-gitea
  namespace: argocd
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  source:
    chart: gitea
    repoURL: https://dl.gitea.com/charts/
    targetRevision: 12.5.0
    helm:
      releaseName: gitea
      values: |-
        global:
          security:
            allowInsecureImages: true

        image:
          registry: harbor.lab.local
          repository: library/gitea
          tag: 1.25.4
          rootless: true

        gitea:
          admin:
            username: gitea_admin
            password: "Gitea12345!"
            email: "admin@lab.local"
          config:
            server:
              DOMAIN: gitea.lab.local
              ROOT_URL: https://gitea.lab.local
            webhook:
              ALLOWED_HOST_LIST: "*"

        # Kyverno require-resource-limits FIX (MAIN container)
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi

        # Kyverno require-resource-limits FIX (INIT containers)
        initContainers:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi

        podSecurityContext:
          fsGroup: 1000

        containerSecurityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]

        persistence:
          enabled: true
          size: 5Gi
          storageClass: longhorn

        postgresql-ha:
          enabled: false

        postgresql:
          enabled: true
          image:
            registry: harbor.lab.local
            repository: library/postgresql
            tag: 17.6.0-debian-12-r4
          primary:
            containerSecurityContext:
              readOnlyRootFilesystem: true
            persistence:
              size: 5Gi
              storageClass: longhorn

        valkey-cluster:
          enabled: true
          image:
            registry: harbor.lab.local
            repository: library/valkey-cluster
            tag: 8.1.3-debian-12-r3

          # ✅ Asıl problem: OOM (Exit 137) -> memory arttır
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

          # ✅ Lab için AOF kapat (RAM/disk baskısını azaltır)
          aofEnabled: false
          valkey:
            aofEnabled: false

          # ReadOnlyRootFS ayarın kalsın (şu an mount’lar zaten rw görünüyor)
          containerSecurityContext:
            readOnlyRootFilesystem: true

          master:
            extraVolumes:
              - name: tmp
                emptyDir: {}
            extraVolumeMounts:
              - name: tmp
                mountPath: /tmp

          replica:
            extraVolumes:
              - name: tmp
                emptyDir: {}
            extraVolumeMounts:
              - name: tmp
                mountPath: /tmp

          persistence:
            storageClass: longhorn
            size: 8Gi

        ingress:
          enabled: true
          className: nginx
          hosts:
            - host: gitea.lab.local
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: gitea-tls
              hosts:
                - gitea.lab.local
