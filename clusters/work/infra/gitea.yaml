apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-gitea
  namespace: argocd
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  source:
    chart: gitea
    repoURL: https://dl.gitea.com/charts/
    targetRevision: 12.5.0
    helm:
      releaseName: gitea
      values: |-
        # Global Registry Ayarı
        global:
          imageRegistry: harbor.lab.local

        image:
          registry: harbor.lab.local
          repository: gitea/gitea
          tag: 1.21.7

        gitea:
          admin:
            password: "Gitea12345!"
          config:
            database:
              DB_TYPE: postgres
              HOST: gitea-postgresql:5432
          
          # Root kullanıcısını engelliyoruz
          podSecurityContext:
            fsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          
          containerSecurityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

          # Ana Gitea container'ı için kaynak limitleri
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi

        # Init Container kaynak limitleri
        initContainers:
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi

        postgresql:
          enabled: true
          image:
            registry: harbor.lab.local
          primary:
            persistence:
              storageClass: longhorn
            resources:
              limits:
                cpu: 300m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 256Mi

        postgresql-ha:
          enabled: false

        valkey-cluster:
          enabled: true
          image:
            registry: harbor.lab.local
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          persistence:
            storageClass: longhorn
