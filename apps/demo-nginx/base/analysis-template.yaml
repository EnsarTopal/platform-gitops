apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: nginx-error-rate
  namespace: demo
spec:
  args:
  - name: namespace
  metrics:
  - name: error-rate
    interval: 30s
    count: 3
    failureLimit: 1          # 3 ölçümden 1'i başarısız olursa dur (eskisi 2'ydi, çok toleranslı)
    initialDelay: 30s        # canary ayağa kalkar kalkmaz ölçüm alma, biraz bekle
    provider:
      prometheus:
        address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(
            rate(
              nginx_ingress_controller_requests{
                status=~"5..",
                exported_namespace="{{args.namespace}}"
              }[2m]
            )
          ) or vector(0)
    # result[0] skaler değer döner; 0.05 = %5 hata oranı eşiği
    successCondition: "result[0] <= 0.05"
    failureCondition: "result[0] > 0.05"
