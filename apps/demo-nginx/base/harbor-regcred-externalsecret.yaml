apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-regcred
  namespace: demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: harbor-regcred
    template:
      type: kubernetes.io/dockerconfigjson
  data:
  - secretKey: .dockerconfigjson
    remoteRef:
      key: registry-secrets
      property: .dockerconfigjson
