resources:
  - ../../base
nameSuffix: -prod
commonLabels:
  env: prod
  team: devops
patches:
  - target:
      kind: Ingress
      name: nginx
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: demo-nginx-prod.lab.local
      - op: replace
        path: /spec/tls/0/hosts/0
        value: demo-nginx-prod.lab.local
      - op: replace
        path: /spec/tls/0/secretName
        value: nginx-prod-tls
  - target:
      kind: ExternalSecret
      name: harbor-regcred
    patch: |-
      - op: replace
        path: /spec/target/name
        value: harbor-regcred-prod
  - target:
      kind: Rollout
      name: nginx
    patch: |-
      - op: replace
        path: /spec/strategy/canary/stableService
        value: nginx-prod
      - op: replace
        path: /spec/strategy/canary/canaryService
        value: nginx-canary-prod
      - op: replace
        path: /spec/strategy/canary/trafficRouting/nginx/stableIngress
        value: nginx-prod
      - op: replace
        path: /spec/strategy/canary/steps/1/analysis/templates/0/templateName
        value: nginx-error-rate-prod
