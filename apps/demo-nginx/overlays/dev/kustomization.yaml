resources:
  - ../../base
nameSuffix: -dev
patches:
  - target:
      kind: Ingress
      name: nginx
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: demo-nginx-dev.lab.local
      - op: replace
        path: /spec/tls/0/hosts/0
        value: demo-nginx-dev.lab.local
  - target:
      kind: Rollout
      name: nginx
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/strategy/canary/stableService
        value: nginx-dev
      - op: replace
        path: /spec/strategy/canary/canaryService
        value: nginx-canary-dev
      - op: replace
        path: /spec/strategy/canary/trafficRouting/nginx/stableIngress
        value: nginx-dev
      # BURASI KRİTİK: Analiz şablonu adını dev sürümüyle değiştiriyoruz
      - op: replace
        path: /spec/strategy/canary/steps/2/analysis/templates/0/templateName
        value: nginx-error-rate-dev
      - op: replace
        path: /spec/template/spec/volumes/0/configMap/name
        value: nginx-html-dev
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: harbor.lab.local/library/nginx-unprivileged:b33b27d
